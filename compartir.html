<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Día compartido — Trading Journal</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/assets/favicon-16x16.png">
<link rel="apple-touch-icon" sizes="180x180" href="/assets/apple-touch-icon.png">
<meta name="theme-color" content="#0b0c0e">
<style>
:root{
  --bg1:#0b0c0e; --bg2:#17181b; --bg3:#202226;
  --border:#1d1e22; --borderl:#2a2c31;
  --t1:#f2f2f3; --t2:#9a9ba0; --t3:#6b6c72;
  --gold:#e3e4e7; --goldbg:rgba(227,228,231,.07); --goldborder:rgba(227,228,231,.18);
  --sp:#06b6d4;
  --font-body:'Inter','Segoe UI',system-ui,-apple-system,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%}
body{
  background:var(--bg1);
  color:var(--t1);
  font-family:var(--font-body);
  padding:24px 16px 60px;
  -webkit-font-smoothing:antialiased;
}
.wrap{max-width:640px;margin:0 auto}
.brand{display:flex;align-items:center;gap:8px;color:var(--t3);font-size:12px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;margin-bottom:18px}
.brand-dot{width:7px;height:7px;border-radius:50%;background:var(--sp)}
.edit-pill{
  margin-left:auto;background:rgba(6,182,212,.12);border:1px solid rgba(6,182,212,.4);
  color:var(--sp);padding:3px 10px;border-radius:20px;font-size:10.5px;font-weight:800;letter-spacing:.3px;
}

.card{
  background:linear-gradient(160deg,var(--bg2) 0%,var(--bg1) 100%);
  border:1px solid var(--border);border-radius:16px;
  padding:22px 20px;margin-bottom:16px;
}
.date-title{font-size:20px;font-weight:800;color:var(--t1);margin-bottom:4px;text-transform:capitalize}
.date-sub{font-size:12.5px;color:var(--t3)}

.result-row{display:flex;align-items:center;gap:12px;margin-top:18px;flex-wrap:wrap}
.result-badge{
  display:inline-flex;align-items:center;gap:8px;
  padding:8px 16px;border-radius:10px;font-size:14px;font-weight:800;
  border:1.5px solid var(--border);
}
.amount{font-size:22px;font-weight:900;letter-spacing:-.5px}
.amount.pos{color:#22c55e}
.amount.neg{color:#f43f5e}
.amount.zero{color:var(--t2)}

.sec-lbl{font-size:11px;font-weight:800;color:var(--t3);text-transform:uppercase;letter-spacing:.8px;margin:22px 0 10px}
.note-box{
  background:var(--bg3);border:1px solid var(--border);border-radius:10px;
  padding:14px;font-size:13.5px;color:var(--t2);line-height:1.6;white-space:pre-wrap;
}
.missed-tags{display:flex;gap:8px;flex-wrap:wrap}
.missed-tag{
  background:var(--bg3);border:1px solid var(--border);border-radius:20px;
  padding:5px 12px;font-size:11.5px;color:var(--t2);font-weight:700;
}

.photo-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px}
.photo-card{position:relative;border-radius:8px;overflow:hidden;border:1px solid var(--border);background:var(--bg3)}
.photo-card img{
  width:100%;aspect-ratio:1;object-fit:cover;
  cursor:pointer;transition:opacity .2s;display:block;
}
.photo-card img:hover{opacity:.85}
.annotate-btn{
  position:absolute;left:6px;right:6px;bottom:6px;
  background:rgba(6,17,20,.82);backdrop-filter:blur(3px);
  border:1px solid rgba(6,182,212,.5);color:var(--sp);
  font-size:10.5px;font-weight:800;padding:6px 0;border-radius:6px;
  cursor:pointer;letter-spacing:.2px;font-family:var(--font-body);
}
.annotate-btn:hover{background:rgba(6,182,212,.18)}

.empty{font-size:13px;color:var(--t3)}

.state{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;padding:80px 20px;gap:10px;
}
.state-icon{font-size:38px;opacity:.5}
.state-title{font-size:16px;font-weight:800;color:var(--t1)}
.state-sub{font-size:13px;color:var(--t3);max-width:320px;line-height:1.6}

.footer-note{font-size:11px;color:var(--t3);text-align:center;margin-top:28px;line-height:1.7}

/* Nombre del mentor */
.name-box{display:flex;gap:8px;align-items:center;margin-bottom:14px}
.name-box input{
  flex:1;background:var(--bg3);border:1px solid var(--border);color:var(--t1);
  padding:9px 12px;border-radius:8px;font-size:13px;font-family:var(--font-body);
}
.name-box input:focus{outline:none;border-color:rgba(6,182,212,.5)}
.name-saved-tag{font-size:11px;color:var(--t3)}

/* Comentarios */
.comment-form textarea{
  width:100%;background:var(--bg3);border:1px solid var(--border);color:var(--t1);
  padding:12px;border-radius:10px;font-size:13.5px;font-family:var(--font-body);
  resize:vertical;min-height:70px;
}
.comment-form textarea:focus{outline:none;border-color:rgba(6,182,212,.5)}
.comment-submit{
  margin-top:10px;background:linear-gradient(135deg,var(--sp) 0%,#0891b2 100%);
  color:#04202a;border:none;padding:10px 20px;border-radius:9px;
  font-size:12.5px;font-weight:800;cursor:pointer;font-family:var(--font-body);
}
.comment-submit:disabled{opacity:.5;cursor:default}

/* Feed de anotaciones */
.ann-item{background:var(--bg3);border:1px solid var(--border);border-radius:10px;padding:12px 14px;margin-bottom:10px}
.ann-head{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.ann-author{font-size:12px;font-weight:800;color:var(--t1)}
.ann-when{font-size:10.5px;color:var(--t3)}
.ann-text{font-size:13px;color:var(--t2);line-height:1.55;white-space:pre-wrap}
.ann-drawing{max-width:220px;border-radius:8px;border:1px solid var(--border);cursor:pointer;display:block}

/* Lightbox */
#lb{
  position:fixed;inset:0;background:rgba(4,4,5,.95);z-index:9999;
  display:none;align-items:center;justify-content:center;padding:24px;
  backdrop-filter:blur(6px);
}
#lb.open{display:flex}
#lb img{max-width:100%;max-height:100%;border-radius:8px;box-shadow:0 20px 60px rgba(0,0,0,.6)}
#lb-close{
  position:fixed;top:18px;right:18px;width:38px;height:38px;border-radius:10px;
  background:var(--bg3);border:1px solid var(--border);color:var(--t2);
  font-size:16px;cursor:pointer;
}

/* Anotador de dibujo */
#annotator{
  position:fixed;inset:0;background:rgba(6,7,8,.97);z-index:10000;
  display:none;flex-direction:column;
}
#annotator.open{display:flex}
.ann-toolbar{
  flex-shrink:0;display:flex;flex-wrap:wrap;gap:8px;align-items:center;
  padding:10px 12px;background:var(--bg2);border-bottom:1px solid var(--border);
}
.ann-tool-btn{
  background:var(--bg3);border:1px solid var(--border);color:var(--t2);
  padding:0 14px;height:36px;border-radius:8px;font-size:12px;font-weight:700;cursor:pointer;
  font-family:var(--font-body);display:flex;align-items:center;gap:6px;
}
.ann-tool-btn.active{border-color:var(--sp);color:var(--sp);background:rgba(6,182,212,.12)}
.ann-toolbar-sep{width:1px;height:22px;background:var(--border);flex-shrink:0}
.ann-swatch{width:22px;height:22px;border-radius:50%;cursor:pointer;border:2px solid transparent}
.ann-swatch.active{border-color:#fff;box-shadow:0 0 0 2px var(--sp)}
.ann-size-btn{
  background:var(--bg3);border:1px solid var(--border);color:var(--t2);
  padding:0 10px;height:36px;border-radius:8px;font-size:11px;font-weight:700;cursor:pointer;
}
.ann-size-btn.active{border-color:var(--sp);color:var(--sp)}
.ann-spacer{flex:1}
.ann-action-btn{
  background:var(--bg3);border:1px solid var(--border);color:var(--t2);
  padding:0 14px;height:36px;border-radius:8px;font-size:12px;font-weight:700;cursor:pointer;font-family:var(--font-body);
}
.ann-save-btn{
  background:linear-gradient(135deg,var(--sp) 0%,#0891b2 100%);color:#04202a;
  border:none;padding:0 18px;height:36px;border-radius:8px;font-size:12.5px;font-weight:800;cursor:pointer;font-family:var(--font-body);
}
.ann-save-btn:disabled{opacity:.5;cursor:default}
.ann-hint{flex-shrink:0;text-align:center;font-size:11.5px;color:var(--t3);padding:8px 12px 0}
.ann-canvas-wrap{flex:1;display:flex;align-items:center;justify-content:center;overflow:auto;padding:14px}
.ann-stage{position:relative;display:inline-block;max-width:100%}
#annotatorCanvas{display:block;max-width:100%;max-height:70vh;touch-action:none;border-radius:6px;box-shadow:0 10px 40px rgba(0,0,0,.5);background:#111;cursor:crosshair}
#annTextLayer{position:absolute;inset:0;pointer-events:none}

/* Cuadros de texto sobre la foto */
.ann-textbox{position:absolute;pointer-events:auto;width:170px}
.ann-textbox-handle{
  display:flex;align-items:center;justify-content:space-between;gap:6px;
  background:rgba(0,0,0,.65);border-radius:6px 6px 0 0;padding:3px 4px 3px 8px;
  cursor:grab;font-size:10.5px;color:#ccc;touch-action:none;user-select:none;
}
.ann-textbox-handle:active{cursor:grabbing}
.ann-textbox-del-btn{background:none;border:none;color:#ccc;font-size:12px;cursor:pointer;padding:2px 5px;line-height:1}
.ann-textbox-del-btn:hover{color:#f43f5e}
.ann-textbox-input{
  display:block;width:100%;resize:none;overflow:hidden;box-sizing:border-box;
  background:rgba(0,0,0,.55);border:1px solid rgba(255,255,255,.22);border-top:none;
  border-radius:0 0 6px 6px;padding:6px 8px;font-family:var(--font-body);font-weight:800;
  line-height:1.3;outline:none;min-height:30px;
}
.ann-textbox-input::placeholder{color:rgba(255,255,255,.45);font-weight:600}

@media (max-width:420px){
  body{padding:16px 12px 40px}
  .card{padding:18px 15px}
  .date-title{font-size:17px}
  .amount{font-size:19px}
  .ann-toolbar{gap:6px}
  .ann-textbox{width:140px}
}

/* — Tap-targets más grandes para dedo, sin importar el ancho de
     pantalla (un touchscreen puede ser angosto o no) — */
@media (pointer:coarse){
  .ann-tool-btn,.ann-size-btn,.ann-action-btn,.ann-save-btn{min-height:44px}
  .ann-swatch{width:26px;height:26px}
  .ann-textbox-handle{padding:7px 8px 7px 10px;font-size:12px}
  .ann-textbox-del-btn{padding:4px 8px;font-size:14px}
  .annotate-btn{padding:10px 0;font-size:11.5px}
  .comment-submit{min-height:44px;padding:12px 20px}
  .name-box input{padding:11px 12px;min-height:44px}
}
</style>
</head>
<body>

<div class="wrap">
  <div class="brand" id="brandRow"><span class="brand-dot"></span>Trading Journal — Día compartido</div>
  <div id="content">
    <div class="state">
      <div class="state-icon">⏳</div>
      <div class="state-title">Cargando día...</div>
    </div>
  </div>
</div>

<div id="lb" onclick="if(event.target===this)closeLb()">
  <button id="lb-close" onclick="closeLb()">✕</button>
  <img id="lb-img" src="" alt="">
</div>

<div id="annotator">
  <div class="ann-toolbar">
    <button class="ann-tool-btn active" id="toolText" onclick="setAnnTool('text')" title="Texto">🅰️ Texto</button>
    <button class="ann-tool-btn" id="toolPen" onclick="setAnnTool('pen')" title="Dibujo libre">✏️ Dibujo</button>
    <button class="ann-tool-btn" id="toolArrow" onclick="setAnnTool('arrow')" title="Flecha">➔ Flecha</button>
    <div class="ann-toolbar-sep"></div>
    <span class="ann-swatch active" style="background:#ffffff" onclick="setAnnColor('#ffffff',this)" title="Blanco"></span>
    <span class="ann-swatch" style="background:#f43f5e" onclick="setAnnColor('#f43f5e',this)" title="Rojo"></span>
    <span class="ann-swatch" style="background:#facc15" onclick="setAnnColor('#facc15',this)" title="Amarillo"></span>
    <span class="ann-swatch" style="background:#06b6d4" onclick="setAnnColor('#06b6d4',this)" title="Celeste"></span>
    <span class="ann-swatch" style="background:#22c55e" onclick="setAnnColor('#22c55e',this)" title="Verde"></span>
    <button class="ann-size-btn" id="sizeS" onclick="setAnnSize('S',this)">S</button>
    <button class="ann-size-btn active" id="sizeM" onclick="setAnnSize('M',this)">M</button>
    <button class="ann-size-btn" id="sizeL" onclick="setAnnSize('L',this)">L</button>
    <button class="ann-action-btn" onclick="annUndo()">↺ Deshacer</button>
    <button class="ann-action-btn" onclick="annClear()">Borrar todo</button>
    <div class="ann-spacer"></div>
    <button class="ann-action-btn" onclick="closeAnnotator()">Cancelar</button>
    <button class="ann-save-btn" id="annSaveBtn" onclick="saveAnnotation()">Guardar</button>
  </div>
  <div class="ann-hint" id="annHint">Tocá la foto para agregar un texto ahí</div>
  <div class="ann-canvas-wrap">
    <div class="ann-stage" id="annStage">
      <canvas id="annotatorCanvas"></canvas>
      <div id="annTextLayer"></div>
    </div>
  </div>
</div>

<script>
'use strict';

const MONTHS = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const DAYS_F = ['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];
const MENTOR_NAME_KEY = 'tj_mentor_name';
const MAX_DIM = 1400;

const RES_INFO = {
  tp: { full:'Take Profit', color:'#22c55e', bg:'rgba(34,197,94,.1)', border:'rgba(34,197,94,.5)' },
  be: { full:'Break Even',  color:'#d4a94e', bg:'rgba(212,169,78,.1)', border:'rgba(212,169,78,.5)' },
  sl: { full:'Stop Loss',   color:'#f43f5e', bg:'rgba(244,63,94,.1)', border:'rgba(244,63,94,.5)' },
  sp: { full:'Stop Profit', color:'#06b6d4', bg:'rgba(6,182,212,.1)', border:'rgba(6,182,212,.5)' },
  ne: { full:'No Entry',    color:'#9a9ba0', bg:'rgba(154,155,160,.1)', border:'rgba(154,155,160,.4)' },
  lt: { full:'Día Lateral', color:'#c9b896', bg:'rgba(201,184,150,.1)', border:'rgba(201,184,150,.4)' },
  fe: { full:'Día Feriado', color:'#7aa8cc', bg:'rgba(122,168,204,.1)', border:'rgba(122,168,204,.4)' },
};

let TOKEN = null;
let CURRENT_DATA = null;

function esc(s){
  const d = document.createElement('div');
  d.textContent = s == null ? '' : String(s);
  return d.innerHTML;
}

function fmtDateTitle(dayKey){
  const [y,m,d] = dayKey.split('-').map(Number);
  const dt = new Date(y, m-1, d);
  return DAYS_F[dt.getDay()] + ' ' + d + ' de ' + MONTHS[m-1] + ' de ' + y;
}

function fmtAmount(n){
  const v = Number(n) || 0;
  const cls = v > 0 ? 'pos' : (v < 0 ? 'neg' : 'zero');
  const sign = v > 0 ? '+' : '';
  return '<span class="amount ' + cls + '">' + sign + v.toLocaleString('es-AR') + '</span>';
}

function fmtWhen(iso){
  const d = new Date(iso);
  return String(d.getDate()).padStart(2,'0') + '/' + String(d.getMonth()+1).padStart(2,'0') + ' ' +
    String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
}

/* ── Grillas de fotos (con botón "Anotar" en modo edición) ───── */
function buildPhotoGrid(photos, editable){
  const withUrl = (photos || []).filter(p => p && p.url);
  if (!withUrl.length) {
    const empty = document.createElement('div');
    empty.className = 'empty';
    empty.textContent = 'Sin fotos.';
    return empty;
  }
  const grid = document.createElement('div');
  grid.className = 'photo-grid';
  withUrl.forEach(p => {
    const card = document.createElement('div');
    card.className = 'photo-card';
    const img = document.createElement('img');
    img.src = p.url;
    img.alt = p.name || 'foto';
    img.loading = 'lazy';
    img.addEventListener('click', () => openLb(p.url));
    card.appendChild(img);
    if (editable) {
      const btn = document.createElement('button');
      btn.className = 'annotate-btn';
      btn.textContent = '✏️ Anotar';
      btn.addEventListener('click', (e) => { e.stopPropagation(); openAnnotator(p.url, p.path || null); });
      card.appendChild(btn);
    }
    grid.appendChild(card);
  });
  return grid;
}

/* ── Feed de comentarios / dibujos previos ───────────────────── */
function buildAnnotationsFeed(annotations){
  const wrap = document.createElement('div');
  if (!annotations || !annotations.length) {
    const empty = document.createElement('div');
    empty.className = 'empty';
    empty.textContent = 'Todavía no hay comentarios ni anotaciones.';
    wrap.appendChild(empty);
    return wrap;
  }
  annotations.forEach(a => {
    const item = document.createElement('div');
    item.className = 'ann-item';
    const head = document.createElement('div');
    head.className = 'ann-head';
    head.innerHTML = '<span class="ann-author">' + esc(a.authorName) + '</span><span class="ann-when">' + fmtWhen(a.createdAt) + '</span>';
    item.appendChild(head);
    if (a.type === 'comment') {
      const txt = document.createElement('div');
      txt.className = 'ann-text';
      txt.textContent = a.commentText || '';
      item.appendChild(txt);
    } else if (a.imageUrl) {
      const img = document.createElement('img');
      img.className = 'ann-drawing';
      img.src = a.imageUrl;
      img.addEventListener('click', () => openLb(a.imageUrl));
      item.appendChild(img);
    }
    wrap.appendChild(item);
  });
  return wrap;
}

/* ── Render principal ─────────────────────────────────────────── */
function renderDay(data){
  CURRENT_DATA = data;
  const editable = data.permission === 'edit';
  const contentEl = document.getElementById('content');
  contentEl.innerHTML = '';

  const brandRow = document.getElementById('brandRow');
  const oldPill = brandRow.querySelector('.edit-pill');
  if (oldPill) oldPill.remove();
  if (editable) {
    const pill = document.createElement('span');
    pill.className = 'edit-pill';
    pill.textContent = '✏️ Modo edición';
    brandRow.appendChild(pill);
  }

  const info = RES_INFO[data.mainResult] || null;
  const resultHtml = info
    ? '<span class="result-badge" style="background:' + info.bg + ';border-color:' + info.border + ';color:' + info.color + '">' + info.full + '</span>'
    : '<span class="result-badge" style="color:var(--t3)">Sin resultado cargado</span>';

  const missed = Array.isArray(data.missedOps) ? data.missedOps : [];
  const mtCount = missed.filter(o => o.type === 'mt').length;
  const neCount = missed.filter(o => o.type === 'ne').length;
  const missedHtml = (mtCount || neCount)
    ? '<div class="missed-tags">' +
        (mtCount ? '<span class="missed-tag">' + mtCount + ' Miss Trade' + (mtCount>1?'s':'') + '</span>' : '') +
        (neCount ? '<span class="missed-tag">' + neCount + ' No Entry' + (neCount>1?'s':'') + '</span>' : '') +
      '</div>'
    : '';

  const card1 = document.createElement('div');
  card1.className = 'card';
  card1.innerHTML =
    '<div class="date-title">' + esc(fmtDateTitle(data.day)) + '</div>' +
    '<div class="date-sub">' + (data.sourceTable === 'fondeo_days' ? 'Cuenta fondeada' : 'Práctica') + '</div>' +
    '<div class="result-row">' + resultHtml + fmtAmount(data.mainAmount) + '</div>' +
    (missedHtml ? '<div class="sec-lbl">Operaciones</div>' + missedHtml : '') +
    '<div class="sec-lbl">Contexto / Notas</div>' +
    (data.contextNote ? '<div class="note-box">' + esc(data.contextNote) + '</div>' : '<div class="empty">Sin notas.</div>');
  contentEl.appendChild(card1);

  const card2 = document.createElement('div');
  card2.className = 'card';
  const lbl1 = document.createElement('div');
  lbl1.className = 'sec-lbl';
  lbl1.style.marginTop = '0';
  lbl1.textContent = 'Fotos de contexto';
  card2.appendChild(lbl1);
  card2.appendChild(buildPhotoGrid(data.contextPhotos, editable));
  const lbl2 = document.createElement('div');
  lbl2.className = 'sec-lbl';
  lbl2.textContent = 'Capturas';
  card2.appendChild(lbl2);
  card2.appendChild(buildPhotoGrid(data.photos, editable));
  contentEl.appendChild(card2);

  if (editable) {
    const card3 = document.createElement('div');
    card3.className = 'card';
    card3.innerHTML =
      '<div class="sec-lbl" style="margin-top:0">Tu nombre</div>' +
      '<div class="name-box">' +
        '<input type="text" id="mentorNameInput" placeholder="¿Cómo te llamás?" value="' + esc(localStorage.getItem(MENTOR_NAME_KEY) || '') + '">' +
      '</div>' +
      '<div class="sec-lbl">Dejar un comentario</div>' +
      '<div class="comment-form">' +
        '<textarea id="commentText" placeholder="Escribí tu comentario sobre este día..."></textarea>' +
        '<button class="comment-submit" id="commentSubmitBtn" onclick="submitComment()">Enviar comentario</button>' +
      '</div>';
    contentEl.appendChild(card3);

    const card4 = document.createElement('div');
    card4.className = 'card';
    const lbl4 = document.createElement('div');
    lbl4.className = 'sec-lbl';
    lbl4.style.marginTop = '0';
    lbl4.textContent = 'Comentarios y anotaciones';
    card4.appendChild(lbl4);
    card4.appendChild(buildAnnotationsFeed(data.annotations));
    contentEl.appendChild(card4);
  }

  const footer = document.createElement('div');
  footer.className = 'footer-note';
  footer.innerHTML = editable
    ? 'Tus comentarios y dibujos quedan guardados para que el dueño del journal los vea.<br>Este link puede vencer o ser revocado en cualquier momento.'
    : 'Este link es de solo lectura y fue generado desde el Trading Journal.<br>Puede vencer o ser revocado por su dueño en cualquier momento.';
  contentEl.appendChild(footer);
}

function renderState(icon, title, sub){
  const contentEl = document.getElementById('content');
  contentEl.innerHTML =
    '<div class="state">' +
      '<div class="state-icon">' + icon + '</div>' +
      '<div class="state-title">' + esc(title) + '</div>' +
      (sub ? '<div class="state-sub">' + esc(sub) + '</div>' : '') +
    '</div>';
}

/* ── Lightbox simple ─────────────────────────────────────────── */
function openLb(url){
  document.getElementById('lb-img').src = url;
  document.getElementById('lb').classList.add('open');
}
function closeLb(){
  document.getElementById('lb').classList.remove('open');
  document.getElementById('lb-img').src = '';
}

/* ── Nombre del mentor ────────────────────────────────────────── */
function getMentorName(){
  const input = document.getElementById('mentorNameInput');
  const name = input ? input.value.trim() : '';
  if (!name) {
    if (input) input.focus();
    alert('Escribí tu nombre antes de continuar, así el dueño del journal sabe quién comentó.');
    return null;
  }
  localStorage.setItem(MENTOR_NAME_KEY, name);
  return name;
}

/* ── Comentarios ──────────────────────────────────────────────── */
async function submitComment(){
  const name = getMentorName();
  if (!name) return;
  const textEl = document.getElementById('commentText');
  const text = textEl.value.trim();
  if (!text) { textEl.focus(); return; }
  const btn = document.getElementById('commentSubmitBtn');
  btn.disabled = true; btn.textContent = 'Enviando...';
  try {
    const res = await fetch('/.netlify/functions/share-day?token=' + encodeURIComponent(TOKEN), {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ type: 'comment', authorName: name, text }),
    });
    const out = await res.json();
    if (!res.ok) throw new Error(out.error || 'Error al guardar');
    await reloadData();
  } catch (e) {
    alert('No se pudo guardar el comentario: ' + e.message);
    btn.disabled = false; btn.textContent = 'Enviar comentario';
  }
}

/* ── Anotador: Texto / Dibujo libre / Flecha ─────────────────── */
const TEXT_SIZES = { S: 18, M: 24, L: 32 };
const STROKE_SIZES = { S: 3, M: 6, L: 10 };
const DRAG_THRESHOLD = 4;   // px (coords. internas del canvas) para distinguir "tap" de "arrastre"
const DELETE_TOLERANCE = 16; // px (coords. internas del canvas) para tocar-y-borrar un trazo/flecha

let annState = {
  tool: 'text', color: '#ffffff', sizeLevel: 'M',
  elements: [], img: null, w: 0, h: 0, photoPath: null,
  startPos: null, dragging: false, current: null,
};
let annCanvas, annCtx;

function currentTextSize(){ return TEXT_SIZES[annState.sizeLevel]; }
function currentStrokeSize(){ return STROKE_SIZES[annState.sizeLevel]; }

const ANN_HINTS = {
  text: 'Tocá la foto para agregar un texto ahí.',
  pen: 'Mantené apretado y arrastrá para dibujar. Tocá (sin arrastrar) un trazo para borrarlo.',
  arrow: 'Arrastrá desde el inicio hasta el final de la flecha. Tocá (sin arrastrar) una flecha para borrarla.',
};

function setAnnTool(tool){
  annState.tool = tool;
  annState.startPos = null; annState.dragging = false; annState.current = null;
  document.getElementById('toolText').classList.toggle('active', tool === 'text');
  document.getElementById('toolPen').classList.toggle('active', tool === 'pen');
  document.getElementById('toolArrow').classList.toggle('active', tool === 'arrow');
  document.getElementById('annHint').textContent = ANN_HINTS[tool];
  if (annCanvas) annCanvas.style.cursor = tool === 'text' ? 'text' : 'crosshair';
}
function setAnnColor(color, el){
  annState.color = color;
  document.querySelectorAll('.ann-swatch').forEach(s => s.classList.remove('active'));
  el.classList.add('active');
}
function setAnnSize(level, el){
  annState.sizeLevel = level;
  document.querySelectorAll('.ann-size-btn').forEach(s => s.classList.remove('active'));
  el.classList.add('active');
}

function openAnnotator(url, photoPath){
  annState.photoPath = photoPath;
  annState.elements = [];
  annState.startPos = null; annState.dragging = false; annState.current = null;
  document.getElementById('annTextLayer').innerHTML = '';
  const overlay = document.getElementById('annotator');
  overlay.classList.add('open');
  annCanvas = document.getElementById('annotatorCanvas');
  annCtx = annCanvas.getContext('2d');
  setAnnTool('text');

  const img = new Image();
  img.crossOrigin = 'anonymous';
  img.onload = () => {
    const scale = Math.min(1, MAX_DIM / Math.max(img.width, img.height));
    annState.w = Math.max(1, Math.round(img.width * scale));
    annState.h = Math.max(1, Math.round(img.height * scale));
    annCanvas.width = annState.w;
    annCanvas.height = annState.h;
    annState.img = img;
    redrawAnnCanvas();
  };
  img.onerror = () => {
    alert('No se pudo cargar la foto para anotar.');
    closeAnnotator();
  };
  img.src = url;

  annCanvas.onclick = onAnnCanvasClick;
  annCanvas.onpointerdown = annPointerDown;
  annCanvas.onpointermove = annPointerMove;
  annCanvas.onpointerup = annPointerUp;
  annCanvas.onpointerleave = annPointerCancel;
}

function closeAnnotator(){
  document.getElementById('annotator').classList.remove('open');
  document.getElementById('annTextLayer').innerHTML = '';
  annState.elements = [];
  annState.img = null;
}

function getAnnPos(e){
  const rect = annCanvas.getBoundingClientRect();
  return {
    x: (e.clientX - rect.left) * (annCanvas.width / rect.width),
    y: (e.clientY - rect.top) * (annCanvas.height / rect.height),
  };
}

function redrawAnnCanvas(){
  if (!annCtx || !annState.img) return;
  annCtx.clearRect(0, 0, annCanvas.width, annCanvas.height);
  annCtx.drawImage(annState.img, 0, 0, annState.w, annState.h);
  annState.elements.forEach(el => { if (el.type === 'pen' || el.type === 'arrow') drawStroke(annCtx, el); });
  if (annState.current) drawStroke(annCtx, annState.current);
}

/* ── Cuadros de texto (overlay sobre el canvas) ──────────────── */
function onAnnCanvasClick(e){
  if (annState.tool !== 'text') return;
  const rect = annCanvas.getBoundingClientRect();
  addTextBoxAt(e.clientX - rect.left, e.clientY - rect.top);
}

function addTextBoxAt(x, y){
  const id = 'tb' + Date.now() + Math.random().toString(36).slice(2, 7);
  const color = annState.color, size = currentTextSize();
  const el = document.createElement('div');
  el.className = 'ann-textbox';
  el.style.left = Math.max(0, x - 10) + 'px';
  el.style.top = Math.max(0, y - 10) + 'px';
  el.style.color = color;
  el.style.fontSize = size + 'px';

  const handle = document.createElement('div');
  handle.className = 'ann-textbox-handle';
  const handleLbl = document.createElement('span');
  handleLbl.textContent = '⠿ mover';
  const delBtn = document.createElement('button');
  delBtn.type = 'button';
  delBtn.className = 'ann-textbox-del-btn';
  delBtn.textContent = '✕';
  handle.appendChild(handleLbl);
  handle.appendChild(delBtn);
  el.appendChild(handle);

  const ta = document.createElement('textarea');
  ta.className = 'ann-textbox-input';
  ta.placeholder = 'Escribí acá...';
  ta.rows = 1;
  ta.style.color = color;
  ta.style.fontSize = size + 'px';
  ta.addEventListener('input', () => { ta.style.height = 'auto'; ta.style.height = ta.scrollHeight + 'px'; });
  ta.addEventListener('pointerdown', (ev) => ev.stopPropagation());
  el.appendChild(ta);

  delBtn.addEventListener('click', (ev) => {
    ev.stopPropagation();
    el.remove();
    annState.elements = annState.elements.filter(e => e.id !== id);
  });
  attachTextBoxDrag(handle, el);

  document.getElementById('annTextLayer').appendChild(el);
  annState.elements.push({ type: 'text', id, color, size, el, textarea: ta });
  ta.focus();
}

function attachTextBoxDrag(handle, el){
  handle.addEventListener('pointerdown', (e) => {
    e.preventDefault();
    e.stopPropagation();
    const startX = e.clientX, startY = e.clientY;
    const startLeft = parseFloat(el.style.left) || 0;
    const startTop = parseFloat(el.style.top) || 0;
    const onMove = (ev) => {
      el.style.left = (startLeft + (ev.clientX - startX)) + 'px';
      el.style.top  = (startTop  + (ev.clientY - startY)) + 'px';
    };
    const onUp = () => {
      document.removeEventListener('pointermove', onMove);
      document.removeEventListener('pointerup', onUp);
    };
    document.addEventListener('pointermove', onMove);
    document.addEventListener('pointerup', onUp);
  });
}

/* ── Dibujo libre y flecha (directo sobre el canvas) ─────────── */
function annPointerDown(e){
  if (annState.tool === 'text') return;
  e.preventDefault();
  try { annCanvas.setPointerCapture(e.pointerId); } catch (err) {}
  annState.startPos = getAnnPos(e);
  annState.dragging = false;
  annState.current = null;
}
function annPointerMove(e){
  if (annState.tool === 'text' || !annState.startPos) return;
  e.preventDefault();
  const pos = getAnnPos(e);
  if (!annState.dragging) {
    const d = Math.hypot(pos.x - annState.startPos.x, pos.y - annState.startPos.y);
    if (d < DRAG_THRESHOLD) return;
    annState.dragging = true;
  }
  if (annState.tool === 'pen') {
    if (!annState.current) annState.current = { type: 'pen', color: annState.color, size: currentStrokeSize(), points: [annState.startPos, pos] };
    else annState.current.points.push(pos);
  } else if (annState.tool === 'arrow') {
    annState.current = { type: 'arrow', color: annState.color, size: currentStrokeSize(), x1: annState.startPos.x, y1: annState.startPos.y, x2: pos.x, y2: pos.y };
  }
  redrawAnnCanvas();
}
function annPointerUp(e){
  if (annState.tool === 'text' || !annState.startPos) return;
  try { annCanvas.releasePointerCapture(e.pointerId); } catch (err) {}
  if (annState.dragging && annState.current) {
    annState.elements.push(annState.current);
  } else if (!annState.dragging) {
    tryDeleteElementAt(getAnnPos(e));
  }
  annState.startPos = null; annState.dragging = false; annState.current = null;
  redrawAnnCanvas();
}
function annPointerCancel(){
  annState.startPos = null; annState.dragging = false; annState.current = null;
  redrawAnnCanvas();
}

function distToSegment(p, a, b){
  const dx = b.x - a.x, dy = b.y - a.y;
  const lenSq = dx*dx + dy*dy;
  let t = lenSq ? ((p.x - a.x)*dx + (p.y - a.y)*dy) / lenSq : 0;
  t = Math.max(0, Math.min(1, t));
  return Math.hypot(p.x - (a.x + t*dx), p.y - (a.y + t*dy));
}

function tryDeleteElementAt(pos){
  let bestIdx = -1, bestDist = Infinity;
  annState.elements.forEach((el, i) => {
    if (el.type === 'pen') {
      if (el.points.length < 2) {
        const d = Math.hypot(pos.x - el.points[0].x, pos.y - el.points[0].y);
        if (d < bestDist) { bestDist = d; bestIdx = i; }
      } else {
        for (let j = 0; j < el.points.length - 1; j++) {
          const d = distToSegment(pos, el.points[j], el.points[j+1]);
          if (d < bestDist) { bestDist = d; bestIdx = i; }
        }
      }
    } else if (el.type === 'arrow') {
      const d = distToSegment(pos, { x: el.x1, y: el.y1 }, { x: el.x2, y: el.y2 });
      if (d < bestDist) { bestDist = d; bestIdx = i; }
    }
  });
  if (bestIdx >= 0 && bestDist <= DELETE_TOLERANCE) annState.elements.splice(bestIdx, 1);
}

function drawStroke(ctx, el){
  ctx.strokeStyle = el.color;
  ctx.fillStyle = el.color;
  ctx.lineWidth = el.size;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  if (el.type === 'pen') {
    if (el.points.length < 2) {
      ctx.beginPath();
      ctx.arc(el.points[0].x, el.points[0].y, el.size/2, 0, Math.PI*2);
      ctx.fill();
      return;
    }
    ctx.beginPath();
    ctx.moveTo(el.points[0].x, el.points[0].y);
    for (let i=1;i<el.points.length;i++) ctx.lineTo(el.points[i].x, el.points[i].y);
    ctx.stroke();
  } else if (el.type === 'arrow') {
    ctx.beginPath();
    ctx.moveTo(el.x1, el.y1);
    ctx.lineTo(el.x2, el.y2);
    ctx.stroke();
    const angle = Math.atan2(el.y2 - el.y1, el.x2 - el.x1);
    const headLen = 8 + el.size * 2;
    ctx.beginPath();
    ctx.moveTo(el.x2, el.y2);
    ctx.lineTo(el.x2 - headLen*Math.cos(angle - Math.PI/6), el.y2 - headLen*Math.sin(angle - Math.PI/6));
    ctx.lineTo(el.x2 - headLen*Math.cos(angle + Math.PI/6), el.y2 - headLen*Math.sin(angle + Math.PI/6));
    ctx.closePath();
    ctx.fill();
  }
}

function annUndo(){
  const last = annState.elements.pop();
  if (last && last.type === 'text' && last.el) last.el.remove();
  redrawAnnCanvas();
}
function annClear(){
  annState.elements.forEach(el => { if (el.type === 'text' && el.el) el.el.remove(); });
  annState.elements = [];
  redrawAnnCanvas();
}

/* ── Aplanar todo (texto + trazos + flechas) sobre el canvas ─── */
function wrapCanvasText(ctx, text, maxWidth){
  const lines = [];
  text.split('\n').forEach(paragraph => {
    const words = paragraph.split(' ');
    let line = '';
    words.forEach(w => {
      const test = line ? line + ' ' + w : w;
      if (line && ctx.measureText(test).width > maxWidth) {
        lines.push(line);
        line = w;
      } else {
        line = test;
      }
    });
    lines.push(line);
  });
  return lines;
}

function roundRectPath(ctx, x, y, w, h, r){
  ctx.beginPath();
  ctx.moveTo(x+r, y);
  ctx.arcTo(x+w, y, x+w, y+h, r);
  ctx.arcTo(x+w, y+h, x, y+h, r);
  ctx.arcTo(x, y+h, x, y, r);
  ctx.arcTo(x, y, x+w, y, r);
  ctx.closePath();
}

function drawTextElementOnCanvas(ctx, box, ratioX, ratioY, stageRect){
  const text = box.textarea.value.trim();
  if (!text) return;
  const taRect = box.textarea.getBoundingClientRect();
  const x = (taRect.left - stageRect.left) * ratioX;
  const y = (taRect.top - stageRect.top) * ratioY;
  const maxWidth = Math.max(40, taRect.width * ratioX - 16);
  const fontSize = Math.max(10, Math.round(box.size * ratioX));

  ctx.font = 'bold ' + fontSize + 'px Inter, "Segoe UI", sans-serif';
  ctx.textBaseline = 'top';
  const lines = wrapCanvasText(ctx, text, maxWidth);
  const lineHeight = fontSize * 1.3;
  const padding = fontSize * 0.35;
  let blockWidth = 0;
  lines.forEach(l => { blockWidth = Math.max(blockWidth, ctx.measureText(l).width); });
  const blockHeight = lines.length * lineHeight;

  ctx.fillStyle = 'rgba(0,0,0,.55)';
  roundRectPath(ctx, x - padding, y - padding, blockWidth + padding*2, blockHeight + padding*2, 6*ratioX);
  ctx.fill();

  ctx.fillStyle = box.color;
  lines.forEach((l, i) => ctx.fillText(l, x, y + i*lineHeight));
}

async function saveAnnotation(){
  const hasContent = annState.elements.some(el =>
    el.type === 'text' ? el.textarea.value.trim() : true
  );
  if (!hasContent) { alert('Agregá al menos un texto, trazo o flecha antes de guardar.'); return; }
  const name = getMentorName();
  if (!name) return;
  const btn = document.getElementById('annSaveBtn');
  btn.disabled = true; btn.textContent = 'Guardando...';
  try {
    redrawAnnCanvas(); // deja trazos y flechas dibujados en el canvas
    const canvasRect = annCanvas.getBoundingClientRect();
    const stageRect = document.getElementById('annStage').getBoundingClientRect();
    const ratioX = annCanvas.width / canvasRect.width;
    const ratioY = annCanvas.height / canvasRect.height;
    annState.elements
      .filter(el => el.type === 'text')
      .forEach(box => drawTextElementOnCanvas(annCtx, box, ratioX, ratioY, stageRect));

    const dataUrl = annCanvas.toDataURL('image/jpeg', 0.9);
    const res = await fetch('/.netlify/functions/share-day?token=' + encodeURIComponent(TOKEN), {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ type: 'drawing', authorName: name, photoPath: annState.photoPath, imageDataUrl: dataUrl }),
    });
    const out = await res.json();
    if (!res.ok) throw new Error(out.error || 'Error al guardar');
    closeAnnotator();
    await reloadData();
  } catch (e) {
    alert('No se pudo guardar el dibujo: ' + e.message);
  } finally {
    btn.disabled = false; btn.textContent = 'Guardar';
  }
}

/* ── Carga inicial ────────────────────────────────────────────── */
async function reloadData(){
  try {
    const res = await fetch('/.netlify/functions/share-day?token=' + encodeURIComponent(TOKEN));
    const data = await res.json();
    if (!res.ok) {
      const icon = res.status === 410 ? '⌛' : (res.status === 404 ? '🔍' : '⚠️');
      renderState(icon, data.error || 'No se pudo cargar este día.', '');
      return;
    }
    renderDay(data);
  } catch (e) {
    renderState('⚠️', 'No se pudo conectar', 'Revisá tu conexión a internet e intentá de nuevo.');
  }
}

function init(){
  TOKEN = new URLSearchParams(location.search).get('token');
  if (!TOKEN) {
    renderState('⚠️', 'Falta el link completo', 'Pedile a la persona que te compartió el día que te pase el link entero.');
    return;
  }
  reloadData();
}

init();
