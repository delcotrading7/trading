<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Día compartido — Trading Journal</title>
<meta name="robots" content="noindex, nofollow">
<style>
:root{
  --bg1:#0b0c0e; --bg2:#17181b; --bg3:#202226;
  --border:#1d1e22; --borderl:#2a2c31;
  --t1:#f2f2f3; --t2:#9a9ba0; --t3:#6b6c72;
  --gold:#e3e4e7; --goldbg:rgba(227,228,231,.07); --goldborder:rgba(227,228,231,.18);
  --sp:#06b6d4;
  --font-body:'Inter','Segoe UI',system-ui,-apple-system,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%}
body{
  background:var(--bg1);
  color:var(--t1);
  font-family:var(--font-body);
  padding:24px 16px 60px;
  -webkit-font-smoothing:antialiased;
}
.wrap{max-width:640px;margin:0 auto}
.brand{display:flex;align-items:center;gap:8px;color:var(--t3);font-size:12px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;margin-bottom:18px}
.brand-dot{width:7px;height:7px;border-radius:50%;background:var(--sp)}

.card{
  background:linear-gradient(160deg,var(--bg2) 0%,var(--bg1) 100%);
  border:1px solid var(--border);border-radius:16px;
  padding:22px 20px;margin-bottom:16px;
}
.date-title{font-size:20px;font-weight:800;color:var(--t1);margin-bottom:4px;text-transform:capitalize}
.date-sub{font-size:12.5px;color:var(--t3)}

.result-row{display:flex;align-items:center;gap:12px;margin-top:18px;flex-wrap:wrap}
.result-badge{
  display:inline-flex;align-items:center;gap:8px;
  padding:8px 16px;border-radius:10px;font-size:14px;font-weight:800;
  border:1.5px solid var(--border);
}
.amount{font-size:22px;font-weight:900;letter-spacing:-.5px}
.amount.pos{color:#22c55e}
.amount.neg{color:#f43f5e}
.amount.zero{color:var(--t2)}

.sec-lbl{font-size:11px;font-weight:800;color:var(--t3);text-transform:uppercase;letter-spacing:.8px;margin:22px 0 10px}
.note-box{
  background:var(--bg3);border:1px solid var(--border);border-radius:10px;
  padding:14px;font-size:13.5px;color:var(--t2);line-height:1.6;white-space:pre-wrap;
}
.missed-tags{display:flex;gap:8px;flex-wrap:wrap}
.missed-tag{
  background:var(--bg3);border:1px solid var(--border);border-radius:20px;
  padding:5px 12px;font-size:11.5px;color:var(--t2);font-weight:700;
}

.photo-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:8px}
.photo-grid img{
  width:100%;aspect-ratio:1;object-fit:cover;border-radius:8px;
  border:1px solid var(--border);cursor:pointer;transition:opacity .2s;
  display:block;background:var(--bg3);
}
.photo-grid img:hover{opacity:.85}

.empty{font-size:13px;color:var(--t3)}

.state{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;padding:80px 20px;gap:10px;
}
.state-icon{font-size:38px;opacity:.5}
.state-title{font-size:16px;font-weight:800;color:var(--t1)}
.state-sub{font-size:13px;color:var(--t3);max-width:320px;line-height:1.6}

.footer-note{font-size:11px;color:var(--t3);text-align:center;margin-top:28px;line-height:1.7}

/* Lightbox */
#lb{
  position:fixed;inset:0;background:rgba(4,4,5,.95);z-index:9999;
  display:none;align-items:center;justify-content:center;padding:24px;
  backdrop-filter:blur(6px);
}
#lb.open{display:flex}
#lb img{max-width:100%;max-height:100%;border-radius:8px;box-shadow:0 20px 60px rgba(0,0,0,.6)}
#lb-close{
  position:fixed;top:18px;right:18px;width:38px;height:38px;border-radius:10px;
  background:var(--bg3);border:1px solid var(--border);color:var(--t2);
  font-size:16px;cursor:pointer;
}

@media (max-width:420px){
  body{padding:16px 12px 40px}
  .card{padding:18px 15px}
  .date-title{font-size:17px}
  .amount{font-size:19px}
}
</style>
</head>
<body>

<div class="wrap">
  <div class="brand"><span class="brand-dot"></span>Trading Journal — Día compartido</div>
  <div id="content">
    <div class="state">
      <div class="state-icon">⏳</div>
      <div class="state-title">Cargando día...</div>
    </div>
  </div>
</div>

<div id="lb" onclick="if(event.target===this)closeLb()">
  <button id="lb-close" onclick="closeLb()">✕</button>
  <img id="lb-img" src="" alt="">
</div>

<script>
'use strict';

const MONTHS = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const DAYS_F = ['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];

const RES_INFO = {
  tp: { full:'Take Profit', color:'#22c55e', bg:'rgba(34,197,94,.1)', border:'rgba(34,197,94,.5)' },
  be: { full:'Break Even',  color:'#d4a94e', bg:'rgba(212,169,78,.1)', border:'rgba(212,169,78,.5)' },
  sl: { full:'Stop Loss',   color:'#f43f5e', bg:'rgba(244,63,94,.1)', border:'rgba(244,63,94,.5)' },
  sp: { full:'Stop Profit', color:'#06b6d4', bg:'rgba(6,182,212,.1)', border:'rgba(6,182,212,.5)' },
  ne: { full:'No Entry',    color:'#9a9ba0', bg:'rgba(154,155,160,.1)', border:'rgba(154,155,160,.4)' },
  lt: { full:'Día Lateral', color:'#c9b896', bg:'rgba(201,184,150,.1)', border:'rgba(201,184,150,.4)' },
  fe: { full:'Día Feriado', color:'#7aa8cc', bg:'rgba(122,168,204,.1)', border:'rgba(122,168,204,.4)' },
};

function esc(s){
  const d = document.createElement('div');
  d.textContent = s == null ? '' : String(s);
  return d.innerHTML;
}

function fmtDateTitle(dayKey){
  const [y,m,d] = dayKey.split('-').map(Number);
  const dt = new Date(y, m-1, d);
  return DAYS_F[dt.getDay()] + ' ' + d + ' de ' + MONTHS[m-1] + ' de ' + y;
}

function fmtAmount(n){
  const v = Number(n) || 0;
  const cls = v > 0 ? 'pos' : (v < 0 ? 'neg' : 'zero');
  const sign = v > 0 ? '+' : '';
  return '<span class="amount ' + cls + '">' + sign + v.toLocaleString('es-AR') + '</span>';
}

function renderPhotoGrid(photos){
  const withUrl = (photos || []).filter(p => p && p.url);
  if (!withUrl.length) return '<div class="empty">Sin fotos.</div>';
  return '<div class="photo-grid">' +
    withUrl.map(p => '<img src="' + esc(p.url) + '" alt="' + esc(p.name||'foto') + '" onclick="openLb(\'' + esc(p.url) + '\')">').join('') +
    '</div>';
}

function renderDay(data){
  const contentEl = document.getElementById('content');
  const info = RES_INFO[data.mainResult] || null;

  const resultHtml = info
    ? '<span class="result-badge" style="background:' + info.bg + ';border-color:' + info.border + ';color:' + info.color + '">' + info.full + '</span>'
    : '<span class="result-badge" style="color:var(--t3)">Sin resultado cargado</span>';

  const missed = Array.isArray(data.missedOps) ? data.missedOps : [];
  const mtCount = missed.filter(o => o.type === 'mt').length;
  const neCount = missed.filter(o => o.type === 'ne').length;
  const missedHtml = (mtCount || neCount)
    ? '<div class="missed-tags">' +
        (mtCount ? '<span class="missed-tag">' + mtCount + ' Miss Trade' + (mtCount>1?'s':'') + '</span>' : '') +
        (neCount ? '<span class="missed-tag">' + neCount + ' No Entry' + (neCount>1?'s':'') + '</span>' : '') +
      '</div>'
    : '';

  contentEl.innerHTML =
    '<div class="card">' +
      '<div class="date-title">' + esc(fmtDateTitle(data.day)) + '</div>' +
      '<div class="date-sub">' + (data.sourceTable === 'fondeo_days' ? 'Cuenta fondeada' : 'Práctica') + '</div>' +
      '<div class="result-row">' + resultHtml + fmtAmount(data.mainAmount) + '</div>' +
      (missedHtml ? '<div class="sec-lbl">Operaciones</div>' + missedHtml : '') +
      '<div class="sec-lbl">Contexto / Notas</div>' +
      (data.contextNote ? '<div class="note-box">' + esc(data.contextNote) + '</div>' : '<div class="empty">Sin notas.</div>') +
    '</div>' +
    '<div class="card">' +
      '<div class="sec-lbl" style="margin-top:0">Fotos de contexto</div>' +
      renderPhotoGrid(data.contextPhotos) +
      '<div class="sec-lbl">Capturas</div>' +
      renderPhotoGrid(data.photos) +
    '</div>' +
    '<div class="footer-note">Este link es de solo lectura y fue generado desde el Trading Journal.<br>Puede vencer o ser revocado por su dueño en cualquier momento.</div>';
}

function renderState(icon, title, sub){
  document.getElementById('content').innerHTML =
    '<div class="state">' +
      '<div class="state-icon">' + icon + '</div>' +
      '<div class="state-title">' + esc(title) + '</div>' +
      (sub ? '<div class="state-sub">' + esc(sub) + '</div>' : '') +
    '</div>';
}

function openLb(url){
  document.getElementById('lb-img').src = url;
  document.getElementById('lb').classList.add('open');
}
function closeLb(){
  document.getElementById('lb').classList.remove('open');
  document.getElementById('lb-img').src = '';
}

async function init(){
  const token = new URLSearchParams(location.search).get('token');
  if (!token) {
    renderState('⚠️', 'Falta el link completo', 'Pedile a la persona que te compartió el día que te pase el link entero.');
    return;
  }
  try {
    const res = await fetch('/.netlify/functions/share-day?token=' + encodeURIComponent(token));
    const data = await res.json();
    if (!res.ok) {
      const icon = res.status === 410 ? '⌛' : (res.status === 404 ? '🔍' : '⚠️');
      renderState(icon, data.error || 'No se pudo cargar este día.', '');
      return;
    }
    renderDay(data);
  } catch (e) {
    renderState('⚠️', 'No se pudo conectar', 'Revisá tu conexión a internet e intentá de nuevo.');
  }
}

init();
</script>
</body>
</html>
