<!DOCTYPE html>
<!-- Test de us-market-holidays.js: abrir este archivo en el navegador.
     Muestra PASS/FAIL de cada comprobación y la lista completa 2026–2036. -->
<html lang="es"><head><meta charset="utf-8"><title>Test feriados EE.UU.</title>
<style>body{font:13px/1.5 Consolas,monospace;background:#111;color:#ddd;padding:20px}.ok{color:#22c55e}.bad{color:#f43f5e}</style>
</head><body><pre id="out"></pre>
<script src="../us-market-holidays.js"></script>
<script>
const lines = []; let fails = 0;
const DOW = ['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'];
function dow(key) { const [y, m, d] = key.split('-').map(Number); return DOW[new Date(y, m - 1, d).getDay()]; }
function check(label, cond) { if (!cond) fails++; lines.push((cond ? 'PASS ' : 'FAIL ') + label); }
function keysOf(y) { return usMarketHolidays(y).map(h => h.key); }
function nameOn(key) { const h = usMarketHolidays(+key.slice(0, 4)).find(x => x.key === key); return h ? h.name : null; }

// 1) Fechas pedidas
[['2026-11-26','Thanksgiving'],['2026-12-25','Christmas'],
 ['2027-01-01',"New Year's Day"],['2027-01-18','Martin Luther King Jr. Day'],['2027-02-15',"Presidents' Day"],
 ['2027-03-26','Good Friday'],['2027-05-31','Memorial Day'],['2027-06-18','Juneteenth'],['2027-07-05','Independence Day'],
 ['2027-09-06','Labor Day'],['2027-11-25','Thanksgiving'],['2027-12-24','Christmas'],['2028-04-14','Good Friday']]
  .forEach(([k, n]) => check(k + ' (' + dow(k) + ') = ' + n, nameOn(k) === n));
const e27 = usEasterSunday(2027);
check('Pascua 2027 = domingo 28 de marzo', e27.getMonth() === 2 && e27.getDate() === 28 && e27.getDay() === 0);
check('NO cierra el 31/12/2027', !keysOf(2027).includes('2027-12-31'));
check('NO cierra el 01/01/2028 (cae sábado)', !keysOf(2028).includes('2028-01-01'));

// 2) Tabla oficial NYSE (nyse.com/markets/hours-calendars, consultada el 24/11/2026)
const NYSE = {
  2026: ['2026-01-01','2026-01-19','2026-02-16','2026-04-03','2026-05-25','2026-06-19','2026-07-03','2026-09-07','2026-11-26','2026-12-25'],
  2027: ['2027-01-01','2027-01-18','2027-02-15','2027-03-26','2027-05-31','2027-06-18','2027-07-05','2027-09-06','2027-11-25','2027-12-24'],
  2028: ['2028-01-17','2028-02-21','2028-04-14','2028-05-29','2028-06-19','2028-07-04','2028-09-04','2028-11-23','2028-12-25'],
};
Object.keys(NYSE).forEach(y => {
  const mine = keysOf(+y), off = NYSE[y];
  const extra = mine.filter(k => !off.includes(k)), missing = off.filter(k => !mine.includes(k));
  check('Coincide con NYSE oficial ' + y + (extra.length || missing.length ? '  sobran: ' + extra + '  faltan: ' + missing : ''),
        !extra.length && !missing.length);
});

// 3) 9 o 10 por año y siempre de lunes a viernes
for (let y = 2027; y <= HOLIDAYS_UNTIL_YEAR; y++) {
  const l = usMarketHolidays(y);
  check(y + ': ' + l.length + ' feriados, todos de lunes a viernes',
        (l.length === 9 || l.length === 10) && l.every(h => !['Sáb','Dom'].includes(dow(h.key))));
}

// 4) Rango y convivencia con datos del usuario
check('Antes del 24/11/2026 no se marca (Labor Day 2026)', usMarketHolidayName('2026-09-07') === null);
check('Después de ' + HOLIDAYS_UNTIL_YEAR + ' no se marca', usMarketHolidayName((HOLIDAYS_UNTIL_YEAR + 1) + '-12-25') === null);
check('Día vacío → feriado automático', usAutoHoliday('2026-11-26', undefined) === 'Thanksgiving');
check('Día con resultado cargado → manda lo mío', usAutoHoliday('2026-11-26', { mainResult: 'tp', mainAmount: 900 }) === null);
check('Día con nota → manda lo mío', usAutoHoliday('2026-11-26', { contextNote: 'x' }) === null);
check('Día reiniciado (todo vacío) → vuelve a ser feriado',
      usAutoHoliday('2026-11-26', { contextNote: '', contextPhotos: [], photos: [], mainResult: null, mainAmount: 0,
        ne: false, lt: false, missedOps: [], reviewed: false, estrategiaCumplida: null, slStatus: null }) === 'Thanksgiving');

// 5) Cierres anticipados a la 1 pm: notas al pie de la tabla oficial de NYSE 2026–2028
const NYSE_EARLY = {
  2026: ['2026-11-27','2026-12-24'],
  2027: ['2027-11-26'],
  2028: ['2028-07-03','2028-11-24'],
};
Object.keys(NYSE_EARLY).forEach(y => {
  const mine = usMarketShortDays(+y).filter(h => h.type === 'early').map(h => h.key), off = NYSE_EARLY[y];
  const extra = mine.filter(k => !off.includes(k)), missing = off.filter(k => !mine.includes(k));
  check('Cierres 1 pm coinciden con NYSE ' + y + (extra.length || missing.length ? '  sobran: ' + extra + '  faltan: ' + missing : ''),
        !extra.length && !missing.length);
});
check('31/12/2026 = baja actividad', (usMarketDayInfo('2026-12-31') || {}).type === 'quiet');
check('24/12/2027 sigue siendo feriado (no cierre 1 pm)', (usMarketDayInfo('2027-12-24') || {}).type === 'holiday');
check('Día con datos el 24/12/2026 → manda lo mío', usAutoMarketDay('2026-12-24', { mainResult: 'sl', mainAmount: -450 }) === null);
for (let y = 2027; y <= HOLIDAYS_UNTIL_YEAR; y++) {
  check(y + ': días especiales de lunes a viernes y sin pisar feriados',
        usMarketShortDays(y).every(h => !['Sáb','Dom'].includes(dow(h.key)) && !keysOf(y).includes(h.key)));
}

// 6) Lista completa en el rango
const TIPO = { holiday: 'Feriado     ', early: 'Cierre 1 pm ', quiet: 'Baja activ. ' };
lines.push('', 'LISTA COMPLETA (desde ' + HOLIDAYS_FROM + ' hasta ' + HOLIDAYS_UNTIL_YEAR + ')');
for (let y = 2026; y <= HOLIDAYS_UNTIL_YEAR; y++) {
  usMarketHolidays(y).map(h => ({ ...h, type: 'holiday' })).concat(usMarketShortDays(y))
    .filter(h => h.key >= HOLIDAYS_FROM).sort((a, b) => a.key < b.key ? -1 : 1)
    .forEach(h => lines.push(h.key + ' ' + dow(h.key) + '  ' + TIPO[h.type] + h.name));
}
lines.unshift((fails ? 'RESULTADO: ' + fails + ' FALLAS' : 'RESULTADO: TODO OK'), '');
document.getElementById('out').textContent = lines.join('\n');
document.title = fails ? 'FAIL' : 'OK';
</script></body></html>
